# StoryFlow Workflow DSL
# 7-step comic drama pipeline with image-to-video.

name: comic_drama
description: "Comic drama generation pipeline with image-to-video"
version: "2.0"

steps:
  - id: script
    agent: script
    description: "Generate script with outline, characters, and episodes"
    input:
      - prompt
      - genre
    output:
      - outline
      - episodes
      - characters

  - id: character
    agent: character
    depends_on: [script]
    description: "Enrich character visual descriptions"
    input:
      - characters
      - outline
    output:
      - characters

  - id: storyboard
    agent: storyboard
    depends_on: [character]
    description: "Convert script to scene-by-scene storyboard"
    input:
      - episodes
      - characters
    output:
      - storyboard
      - scenes

  - id: image
    agent: image
    depends_on: [storyboard]
    description: "Generate images for each scene via cloud API"
    input:
      - storyboard
      - characters
    output:
      - images

  - id: image_to_video
    agent: image_to_video
    depends_on: [image]
    description: "Convert images to video clips via cloud API"
    input:
      - images
      - storyboard
    output:
      - video_clips

  - id: voice
    agent: voice
    depends_on: [storyboard]
    description: "Generate voiceover for scenes via cloud TTS API"
    input:
      - storyboard
      - characters
    output:
      - audios
    parallel_group: media_post

  - id: video
    agent: video
    depends_on: [image_to_video, voice]
    description: "Merge video clips, audio, and subtitles into final MP4"
    input:
      - video_clips
      - audios
      - storyboard
    output:
      - video_path

quality:
  enabled: true
  check_after:
    - script
    - character
    - storyboard
    - image
    - voice

director:
  enabled: false
  max_retries: 3